[project]
name = "erp-paris"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Erreurs, style, imports, bonnes pratiques, simplifications, noms (pep8-naming), sécurité de base.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "RUF"]
ignore = ["S101"]  # assert : autorisé dans les tests
# Typographie française voulue (apostrophe, guillemets, espaces insécables).
allowed-confusables = ["’", "«", "»", "\u00a0", "\u202f"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["N999"]

[tool.mypy]
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Starlette conseille httpx2 pour le client de test ; trop récent pour l'instant (moins de deux
# semaines) : httpx est gardé, l'avertissement est connu.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
